name: hifis

# 홈서버 self-host 구성 (CLAUDE.md §10).
# 개발:  docker compose up --build         → db + redis + api(hot-reload)
# 배포:  docker compose --profile prod up   → caddy(자동 HTTPS) 추가
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 이 홈서버엔 다른 스택이 5432/6379/8000 을 이미 점유 중 → 겹치지 않는 포트 사용.
    # (앱↔db 통신은 내부 네트워크라 호스트 포트와 무관)
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hifis} -d ${POSTGRES_DB:-hifis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      # 개발용 전체 마운트 (핫리로드 + 컨테이너 안에서 alembic 실행 가능).
      # 배포 시엔 이 줄과 command 를 걷어내면 이미지에 구운 gunicorn(Dockerfile CMD)으로 실행된다.
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
