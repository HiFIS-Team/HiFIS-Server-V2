<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>피트니스스타</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────────────────────
   매장 TV — 해결된 컴플레인이 **위에서부터 쌓인다**. (피트니스스타 회원용)
   한 화면에 다섯 줄이고, 새로 해결된 것이 위에서 내려오면 아래가 한 칸씩
   밀리고 맨 아래 것이 화면 밖으로 빠진다. 늘 최신이 맨 위다.
   세로(9:16)로 세운 화면 기준이고, **멀리서 보는 것**이라
   글자를 px 가 아니라 화면 크기 비율(vmin)로 잡는다.
   색은 앱 디자인 토큰 그대로다.
   ───────────────────────────────────────────────────────────── */
:root{
  --primary:#3182F6; --primary-light:#E8F3FF;
  --grad-a:#4593FC;  --grad-b:#2A6FF2;
  --bg:#F2F4F6;      --surface:#FFFFFF;
  --g900:#191F28; --g600:#4E5968; --g500:#6B7684; --g400:#8B95A1;
  --g200:#D1D6DB; --g100:#E5E8EB;
  /* 세로 화면에서는 vmin 이 곧 가로폭이라 글자 크기의 기준이 된다 */
  --u:1vmin;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              system-ui,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--g900);
  -webkit-font-smoothing:antialiased;
  /* TV 리모컨으로 실수로 뭔가 고르는 일이 없게 */
  user-select:none; cursor:none;
}

.screen{height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*7)}

/* ── 머리 ── */
.head{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:calc(var(--u)*2.2)}
.dot{
  width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:calc(var(--u)*1.4);
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
}
.brand b{font-size:calc(var(--u)*3.4);font-weight:800;letter-spacing:-.02em}
.head .branch{font-size:calc(var(--u)*3);font-weight:600;color:var(--g400)}

/* ── 머리말 ──
   줄마다 붙이던 것을 화면 위 하나로 올렸다. 다섯 줄이 같이 서 있어서
   줄마다 큰 글씨를 얹으면 정작 회원 목소리가 안 보인다.
   해결된 게 한 건뿐이어도 화면이 멈춘 것처럼 보이지 않게 문구가 돌아간다. */
.lead{
  margin:calc(var(--u)*6) 0 calc(var(--u)*5);
  font-size:calc(var(--u)*5.4);font-weight:800;line-height:1.35;
  letter-spacing:-.03em;
  transition:opacity .5s ease;
}
.lead em{font-style:normal;color:var(--primary)}
.lead.out{opacity:0}

/* ── 본문 ──
   줄은 **자리를 계산해서 절대 위치로** 놓는다. 그래야 새 줄이 들어올 때
   아래 줄들이 한 칸씩 미끄러져 내려간다 (문서 흐름에 두면 툭 튄다). */
.stage{flex:1;position:relative;overflow:hidden}
.row{
  position:absolute;left:0;right:0;top:0;
  display:flex;align-items:center;gap:calc(var(--u)*3.5);
  padding:0 calc(var(--u)*5);
  background:var(--surface);border-radius:calc(var(--u)*4);
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(16,24,40,.05);
  opacity:0;
  transition:transform .75s cubic-bezier(.22,.61,.36,1),opacity .5s ease;
  will-change:transform;
}
.tick{
  flex:none;
  width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;
  background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;
}
.tick svg{
  width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);
  fill:none;stroke:var(--primary);stroke-width:2.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.body{min-width:0}
.quote{
  font-size:calc(var(--u)*4.2);font-weight:600;line-height:1.45;color:var(--g600);
  word-break:keep-all;
  /* 칸 높이가 정해져 있어서 긴 글은 두 줄까지만 — 넘치면 줄이 서로 겹친다 */
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.when{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*2.8);color:var(--g400);font-weight:600}

/* 아직 해결된 게 없을 때 — 벽에 빈 화면을 걸어 둘 수는 없다 */
.idle{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;transition:opacity .5s ease;
}
.idle.off{opacity:0}
.idle .check{
  width:calc(var(--u)*20);height:calc(var(--u)*20);margin-bottom:calc(var(--u)*6);
  border-radius:50%;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;
}
.idle .check svg{
  width:calc(var(--u)*10);height:calc(var(--u)*10);
  fill:none;stroke:var(--primary);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
}
.idle p{font-size:calc(var(--u)*3.6);color:var(--g500);font-weight:500;line-height:1.6}

/* 화면이 가로로 걸려 있어도 무너지지는 않게 (세로 기준이지만) */
@media (orientation:landscape){ :root{--u:1.6vmin} }
</style>
</head>
<body>
<div class="screen">

  <header class="head">
    <div class="brand"><span class="dot"></span><b>피트니스스타</b></div>
    <div class="branch" id="branch"></div>
  </header>

  <p class="lead" id="lead">회원님 목소리로<br><em>피트니스스타는 자랍니다</em></p>

  <main class="stage" id="stage">
    <section class="idle" id="idle">
      <div class="check">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9-8.4A5 5 0 0 1 12 6.2 5 5 0 0 1 21 11.6c-2 4.1-9 8.4-9 8.4z"/></svg>
      </div>
      <p>불편하셨던 점을 말씀해 주세요.</p>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';

var TOKEN = location.pathname.replace(/\/+$/,'').split('/').pop();

var MAX       = 5;       // 한 화면에 세우는 줄 수
var REFRESH   = 15000;   // 서버에 다시 물어보는 주기 — 해결하면 이만큼 안에 뜬다
var LEAD_HOLD = 10000;   // 머리말을 바꾸는 주기
var SLIDE     = 800;     // 줄이 미끄러지는 시간 (CSS transition 과 맞춘다)

// 화면 머리말 — **돌아가며 바뀐다.** 하나로 고정하면 해결된 게 한 건뿐일 때
// 같은 화면이 종일 걸려 있다.
//
// '고쳤습니다' 처럼 조치를 알리는 말이 아니라, **회원 목소리가 매장을 키운다**는
// 쪽으로 쓴다. 무엇을 고쳤는지는 아래 줄들이 이미 말해 준다.
// 뒷줄이 파랗게 강조된다. [앞줄, 뒷줄]
var LEADS = [
  ['회원님 목소리로',   '피트니스스타는 자랍니다'],
  ['한 말씀 한 말씀이',  '더 좋은 곳을 만듭니다'],
  ['들을수록',         '피트니스스타는 나아집니다'],
  ['오늘도 한 가지',    '회원님과 함께 바꿉니다'],
  ['회원님이 만드는',   '더 나은 피트니스스타']
];
var lastLead = 0;

var rows  = {};   // id → 화면에 붙어 있는 줄
var order = [];   // 지금 서 있는 차례 (위에서부터, 최신이 앞)
var first = true;

var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function dateLabel(iso){
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 해결';
}

// ── 머리말 ──────────────────────────────────────────────────────

function rollLead(){
  if (LEADS.length < 2) return;
  var i;
  // 바로 앞과 같은 것은 피한다 — 연달아 같은 말이 나오면 안 도는 것처럼 보인다
  do { i = Math.floor(Math.random() * LEADS.length); } while (i === lastLead);
  lastLead = i;

  var el = $('lead');
  el.classList.add('out');
  setTimeout(function(){
    el.innerHTML = esc(LEADS[i][0]) + '<br><em>' + esc(LEADS[i][1]) + '</em>';
    el.classList.remove('out');
  }, 500);
}

// ── 줄 자리 ─────────────────────────────────────────────────────
//
// 칸 높이를 화면에서 재서 나눈다. TV 마다 비율이 달라서 vmin 으로 박아 두면
// 어떤 화면에서는 다섯 번째 줄이 잘린다.

var cardH = 0, gap = 0;

function measure(){
  var h = $('stage').clientHeight;
  gap = Math.round(h * 0.022);
  cardH = Math.round((h - gap * (MAX - 1)) / MAX);
}

/// 위에서 몇 번째 자리인지 → 화면에서의 y. -1 은 화면 위(들어오기 전)다
function yAt(index){ return index * (cardH + gap); }

function place(el, index, visible){
  el.style.height = cardH + 'px';
  el.style.transform = 'translateY(' + yAt(index) + 'px)';
  el.style.opacity = visible ? '1' : '0';
}

function build(item){
  var el = document.createElement('article');
  el.className = 'row';
  el.innerHTML =
    '<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>'
    + '<div class="body">'
    +   '<p class="quote">' + esc(item.text) + '</p>'
    +   '<p class="when">' + esc(dateLabel(item.resolvedAt)) + '</p>'
    + '</div>';
  return el;
}

// ── 화면 갱신 ───────────────────────────────────────────────────

function render(items){
  measure();
  var want = items.slice(0, MAX);
  var wantIds = want.map(function(it){ return it.id; });

  // 1) 새로 들어온 줄을 화면 **위쪽 밖**에 미리 붙여 둔다
  var incoming = [];
  want.forEach(function(item){
    if (rows[item.id]) return;
    var el = build(item);
    $('stage').appendChild(el);
    place(el, -1, false);
    rows[item.id] = el;
    incoming.push(el);
  });

  // 2) 빠질 줄은 맨 아래 자리로 내려보내고 지운다
  order.forEach(function(id){
    if (wantIds.indexOf(id) >= 0) return;
    var el = rows[id];
    delete rows[id];
    if (!el) return;
    place(el, MAX, false);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, SLIDE);
  });

  order = wantIds;

  // 3) 한 프레임 뒤에 제자리로 보낸다.
  //    붙자마자 옮기면 브라우저가 처음 자리를 안 그려서 전환이 안 걸린다
  var move = function(){
    wantIds.forEach(function(id, i){ place(rows[id], i, true); });
  };
  if (incoming.length && !first){
    requestAnimationFrame(function(){ requestAnimationFrame(move); });
  } else {
    move();   // 첫 화면은 그냥 제자리에 나타난다
  }

  $('idle').classList.toggle('off', wantIds.length > 0);
}

function apply(data){
  $('branch').textContent = data.branchName || '';
  render(data.resolved || []);
  first = false;
}

function load(){
  fetch('/tv/' + encodeURIComponent(TOKEN) + '/resolved', {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw r; return r.json(); })
    .then(apply)
    // 인터넷이 잠깐 끊겨도 **화면은 그대로 둔다.** 벽에 걸린 TV 가
    // 오류 문구로 바뀌는 것보다 마지막 화면이 남아 있는 게 낫다
    .catch(function(){});
}

load();
setInterval(load, REFRESH);
setInterval(rollLead, LEAD_HOLD);

// TV 는 몇 달씩 켜 둔다 — 브라우저가 절전으로 멈췄다 깨어나면 바로 다시 받는다
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) load();
});

// 화면 크기가 바뀌면 칸 높이를 다시 재서 줄을 옮긴다
window.addEventListener('resize', function(){
  measure();
  order.forEach(function(id, i){ place(rows[id], i, true); });
});

})();
</script>
</body>
</html>
