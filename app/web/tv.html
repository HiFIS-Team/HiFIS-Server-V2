<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HiFIS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────────────────────
   매장 TV — 해결된 컴플레인이 한 장씩 돈다.
   세로(9:16)로 세운 화면 기준이고, **멀리서 보는 것**이라
   글자를 px 가 아니라 화면 크기 비율(vmin)로 잡는다.
   색은 앱 디자인 토큰 그대로다.
   ───────────────────────────────────────────────────────────── */
:root{
  --primary:#3182F6; --primary-light:#E8F3FF;
  --grad-a:#4593FC;  --grad-b:#2A6FF2;
  --bg:#F2F4F6;      --surface:#FFFFFF;
  --g900:#191F28; --g600:#4E5968; --g500:#6B7684; --g400:#8B95A1;
  --g200:#D1D6DB; --g100:#E5E8EB;
  /* 세로 화면에서는 vmin 이 곧 가로폭이라 글자 크기의 기준이 된다 */
  --u:1vmin;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
              system-ui,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--g900);
  -webkit-font-smoothing:antialiased;
  /* TV 리모컨으로 실수로 뭔가 고르는 일이 없게 */
  user-select:none; cursor:none;
}

.screen{height:100%;display:flex;flex-direction:column;padding:calc(var(--u)*7)}

/* ── 머리 ── */
.head{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:calc(var(--u)*2.2)}
.dot{
  width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:calc(var(--u)*1.4);
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
}
.brand b{font-size:calc(var(--u)*3.4);font-weight:800;letter-spacing:-.02em}
.head .branch{font-size:calc(var(--u)*3);font-weight:600;color:var(--g400)}

/* ── 본문 ── */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.card{
  width:100%;text-align:center;position:absolute;
  opacity:0;transform:translateY(calc(var(--u)*2.4));
  transition:opacity .6s ease,transform .6s cubic-bezier(.22,.61,.36,1);
}
.card.on{opacity:1;transform:none}

.check{
  width:calc(var(--u)*20);height:calc(var(--u)*20);margin:0 auto calc(var(--u)*6);
  border-radius:50%;background:var(--primary-light);
  display:flex;align-items:center;justify-content:center;
}
.check svg{
  width:calc(var(--u)*10);height:calc(var(--u)*10);
  fill:none;stroke:var(--primary);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
}
.card.on .check{animation:pop .7s cubic-bezier(.34,1.4,.64,1) both}
@keyframes pop{from{transform:scale(.62);opacity:0}to{transform:scale(1);opacity:1}}

.lead{
  font-size:calc(var(--u)*6.2);font-weight:800;line-height:1.35;
  letter-spacing:-.03em;margin-bottom:calc(var(--u)*5);
}
.lead em{font-style:normal;color:var(--primary)}

.quote{
  display:inline-block;max-width:88%;
  padding:calc(var(--u)*5) calc(var(--u)*5.5);border-radius:calc(var(--u)*4);
  background:var(--surface);box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(16,24,40,.05);
  font-size:calc(var(--u)*5);font-weight:600;line-height:1.55;color:var(--g600);
  word-break:keep-all;
}
.when{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*3.2);color:var(--g400);font-weight:600}

/* 아직 해결된 게 없을 때 — 벽에 빈 화면을 걸어 둘 수는 없다 */
.idle{text-align:center}
.idle .lead{margin-bottom:calc(var(--u)*3)}
.idle p{font-size:calc(var(--u)*3.6);color:var(--g500);font-weight:500;line-height:1.6}

/* ── 발 ── */
.foot{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);
      height:calc(var(--u)*4)}
.pip{
  width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:50%;
  background:var(--g200);transition:background .4s,transform .4s;
}
.pip.on{background:var(--primary);transform:scale(1.35)}

/* 화면이 가로로 걸려 있어도 무너지지는 않게 (세로 기준이지만) */
@media (orientation:landscape){ :root{--u:1.6vmin} }
</style>
</head>
<body>
<div class="screen">

  <header class="head">
    <div class="brand"><span class="dot"></span><b>HiFIS</b></div>
    <div class="branch" id="branch"></div>
  </header>

  <main class="stage" id="stage">
    <section class="card on" id="idle">
      <div class="idle">
        <div class="check">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.3-9-8.4A5 5 0 0 1 12 6.2 5 5 0 0 1 21 11.6c-2 4.1-9 8.4-9 8.4z"/></svg>
        </div>
        <p class="lead">말씀해 주신 것은<br><em>바로 고치겠습니다</em></p>
        <p>불편하셨던 점을 남겨주세요.</p>
      </div>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script>
(function(){
'use strict';

var TOKEN = location.pathname.replace(/\/+$/,'').split('/').pop();

var HOLD    = 9000;    // 한 장을 보여주는 시간
var REFRESH = 15000;   // 서버에 다시 물어보는 주기 — 해결하면 이만큼 안에 뜬다
var MAX_PIP = 8;       // 아래 점은 이만큼까지만 그린다 (많으면 줄이 길어진다)

var items = [];        // 해결된 컴플레인
var seen  = {};        // 이미 띄운 적 있는 id
var at    = -1;        // 지금 몇 번째
var timer = null;
var first = true;

var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function dateLabel(iso){
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 해결';
}

function card(item){
  var el = document.createElement('section');
  el.className = 'card';
  el.innerHTML =
    '<div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>'
    + '<p class="lead">말씀해 주신 것,<br><em>고쳤습니다</em></p>'
    + '<div class="quote">' + esc(item.text) + '</div>'
    + '<div class="when">' + esc(dateLabel(item.resolvedAt)) + '</div>';
  return el;
}

function pips(){
  var foot = $('foot');
  foot.innerHTML = '';
  if (items.length < 2) return;                 // 한 장뿐이면 점이 뜻이 없다
  var n = Math.min(items.length, MAX_PIP);
  for (var i = 0; i < n; i++){
    var p = document.createElement('span');
    p.className = 'pip' + (i === at % n ? ' on' : '');
    foot.appendChild(p);
  }
}

function show(index){
  at = index;
  var stage = $('stage');
  var next = card(items[at]);
  stage.appendChild(next);
  // 한 프레임 뒤에 켜야 전환이 걸린다 (붙자마자 켜면 그냥 나타난다)
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      [].forEach.call(stage.querySelectorAll('.card'), function(c){
        if (c !== next) c.classList.remove('on');
      });
      next.classList.add('on');
    });
  });
  // 넘어간 장은 전환이 끝난 뒤 치운다 — 계속 쌓이면 TV 가 느려진다
  setTimeout(function(){
    [].forEach.call(stage.querySelectorAll('.card'), function(c){
      if (c !== next && c.id !== 'idle') c.remove();
    });
    var idle = $('idle');
    if (idle) idle.classList.remove('on');
  }, 800);

  seen[items[at].id] = true;
  pips();
}

function tick(){
  clearTimeout(timer);
  if (!items.length) return;
  show((at + 1) % items.length);
  timer = setTimeout(tick, HOLD);
}

function apply(data){
  $('branch').textContent = data.branchName || '';
  var next = data.resolved || [];

  // 방금 해결한 것이 있으면 **기다리지 않고 바로** 그 장으로 넘어간다.
  // 완료를 누른 사람이 TV 를 보고 있을 때 반응이 없으면 안 된 줄 안다
  var fresh = -1;
  if (!first){
    for (var i = 0; i < next.length; i++){
      if (!seen[next[i].id]){ fresh = i; break; }
    }
  }

  items = next;

  if (!items.length){
    clearTimeout(timer);
    at = -1;
    $('foot').innerHTML = '';
    [].forEach.call($('stage').querySelectorAll('.card'), function(c){
      if (c.id !== 'idle') c.remove(); else c.classList.add('on');
    });
    return;
  }

  if (first || at < 0){
    first = false;
    clearTimeout(timer);
    show(0);
    timer = setTimeout(tick, HOLD);
  } else if (fresh >= 0){
    clearTimeout(timer);
    show(fresh);
    timer = setTimeout(tick, HOLD);
  } else if (at >= items.length){
    at = items.length - 1;   // 목록이 줄었을 때 범위 밖으로 안 나가게
  }
}

function load(){
  fetch('/tv/' + encodeURIComponent(TOKEN) + '/resolved', {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw r; return r.json(); })
    .then(apply)
    // 인터넷이 잠깐 끊겨도 **화면은 그대로 둔다.** 벽에 걸린 TV 가
    // 오류 문구로 바뀌는 것보다 마지막 화면이 남아 있는 게 낫다
    .catch(function(){});
}

load();
setInterval(load, REFRESH);

// TV 는 몇 달씩 켜 둔다 — 브라우저가 절전으로 멈췄다 깨어나면 바로 다시 받는다
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) load();
});

})();
</script>
</body>
</html>
