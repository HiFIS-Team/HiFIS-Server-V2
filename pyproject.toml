[project]
name = "hifis-server"
version = "0.8.0"
description = "HiFIS 직원 관리 플랫폼 백엔드 (FastAPI · 홈서버 self-host)"
requires-python = ">=3.12"

# CLAUDE.md §8 스택. 초기 부팅에 필요한 웹/설정 + Phase 1(조직·인증) 뼈대까지.
# 이후 단계에서 추가: apscheduler, redis, pywebpush, cryptography, weasyprint, pillow, slowapi
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "httpx[http2]>=0.27",  # http2 = APNs 필수 (애플이 HTTP/1.1 을 안 받는다)
    "apscheduler>=3.10",
    "pywebpush>=2.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "solapi>=5.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# 모델 등록 지점 — Alembic autogenerate 가 metadata 를 인식하려면
# 여기서 import 만 해 두고 쓰지 않는다. 그래서 "안 쓰는 import" 검사에서 뺀다.
"app/models/__init__.py" = ["F401"]
