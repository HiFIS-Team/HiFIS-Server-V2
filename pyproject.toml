[project]
name = "hifis-server"
version = "0.25.0"
description = "HiFIS 직원 관리 플랫폼 백엔드 (FastAPI · 홈서버 self-host)"
requires-python = ">=3.12"

# CLAUDE.md §8 스택. 초기 부팅에 필요한 웹/설정 + Phase 1(조직·인증) 뼈대까지.
# 이후 단계에서 추가: apscheduler, redis, pywebpush, cryptography, weasyprint, pillow, slowapi
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "httpx[http2]>=0.27",  # http2 = APNs 필수 (애플이 HTTP/1.1 을 안 받는다)
    "apscheduler>=3.10",
    "pywebpush>=2.0",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "solapi>=5.0.3",
    # 공휴일 — 결근 판정에서 뺀다. 오프라인 계산이라 바깥 API 가 죽어도 판정이 안 흔들린다
    "holidays>=0.103",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 검사할 규칙을 **직접 적어 둔다.** ruff 의 기본값에 맡기면 안 된다 —
# 0.16 에서 기본이 826개로 넓어지면서 CI 가 통째로 죽었다 (564건, 2026-08-12).
# 그중 362건이 `db = Depends(get_db)` 를 잡는 B008 이었다. FastAPI 의 정석 문법이라
# 코드가 아니라 검사가 틀린 것이었다.
#
#   E4 import · E7 문법 · E9 구문오류 · F 안 쓰는 이름·오타
#
# 여기 있는 것만 본다. 규칙을 늘리려면 코드를 먼저 맞추고 한 줄씩 더한다.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 모델 등록 지점 — Alembic autogenerate 가 metadata 를 인식하려면
# 여기서 import 만 해 두고 쓰지 않는다. 그래서 "안 쓰는 import" 검사에서 뺀다.
"app/models/__init__.py" = ["F401"]
