# 검사 + 배포
#
#   develop 푸시 → 검사만
#   main    푸시 → 검사 통과하면 홈서버에 배포
#
# 배포는 SSH 키로 서버의 `/usr/local/bin/deploy-hifis.sh` 하나만 실행한다.
# 그 키는 authorized_keys 에 command= 로 묶여 있어 **다른 명령은 못 돌린다**
# (셸도 안 열리고 포트 포워딩도 막혀 있다).

name: 검사 · 배포

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞의 것은 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff 설치
        # 판을 고정한다 — `ruff` 로만 두면 새 판이 나올 때마다 검사 기준이 바뀐다
        # (0.16 에서 실제로 그래서 CI 가 죽었다. pyproject 의 select 와 짝이다)
        run: pip install --quiet "ruff==0.16.2"

      - name: 코드 검사
        run: ruff check app/ tests/

      - name: 서식 검사
        run: ruff format --check app/
        continue-on-error: true   # 아직 서식을 통일하지 않았다 — 참고용

      # DB 도 서버도 안 띄운다 — 순수 계산만 잰다. 그래서 준비가 필요 없고
      # **몇 초 만에 끝난다.** 무거워지면 안 돌리게 되고, 안 돌리면 없는 것과 같다.
      - name: 테스트 준비
        run: pip install --quiet -e ".[dev]"

      - name: 테스트
        run: pytest tests/ -q

      - name: 도커 이미지가 빌드되나
        run: docker build -t hifis-api:ci .

  deploy:
    name: 배포
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 홈서버에 배포
        env:
          KEY:   ${{ secrets.DEPLOY_KEY }}
          HOST:  ${{ secrets.SSH_HOST }}
          PORT:  ${{ secrets.SSH_PORT }}
          USER:  ${{ secrets.SSH_USER }}
          HOSTKEY: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY"     > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST"

      # 결과를 앱 푸시로 — 직군이 개발자인 사람에게 간다.
      #
      # `always()` 라 위 단계가 죽어도 돈다. **성공도 보낸다** — 실패만 보내면
      # "안 왔는데 성공한 건가 알림이 고장난 건가"를 구분할 수 없다.
      #
      # `INTERNAL_HOOK_TOKEN` 이 없으면 조용히 건너뛴다 (비밀을 안 넣은 포크에서
      # 워크플로가 죽지 않게). **알림이 배포를 실패로 만들지 않는다** — 방금
      # 컨테이너를 갈아끼운 직후라 API 가 아직 안 떴을 수 있어서, 몇 번
      # 다시 걸어 보고 그래도 안 되면 그냥 넘어간다.
      - name: 배포 결과 알림
        if: always()
        env:
          TOKEN:  ${{ secrets.INTERNAL_HOOK_TOKEN }}
          RESULT: ${{ job.status }}
          # 이 job 은 checkout 을 안 한다 (SSH 한 줄만 돌린다) — `git log` 를 못 쓴다.
          # 커밋 제목은 워크플로 컨텍스트에서 꺼내고, 첫 줄만 남긴다
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$TOKEN" ] || { echo "INTERNAL_HOOK_TOKEN 없음 — 알림 건너뜀"; exit 0; }
          [ "$RESULT" = success ] && STATUS=success || STATUS=failure
          BODY=$(jq -nc --arg s "$STATUS" --arg r "$GITHUB_REF" \
                        --arg h "$GITHUB_SHA" --arg m "$(printf '%s' "$SUBJECT" | head -1)" \
                 '{status:$s, ref:$r, sha:$h, message:$m}')
          for i in 1 2 3; do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' \
                     -X POST https://api.hifis.app/security/deploy \
                     -H "Authorization: Bearer $TOKEN" \
                     -H 'Content-Type: application/json' \
                     -d "$BODY" || echo 000)
            [ "$code" = 204 ] && { echo "알림 보냄"; exit 0; }
            echo "알림 실패($code) — $i/3"; sleep 10
          done
          echo "알림을 못 보냈다 (배포 자체는 위 단계 결과를 따른다)"
