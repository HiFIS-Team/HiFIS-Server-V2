name: hifis

# 배포용 구성 — 개발용 docker-compose.yml 과 다른 점
#   · 소스 마운트·핫리로드 없음 (이미지에 구운 gunicorn 으로 실행)
#   · db·redis 를 호스트에 노출하지 않음 (내부 네트워크로만)
#   · api 는 127.0.0.1:8000 에만 (앞단 nginx 가 받는다)
#   · 데이터는 전부 이름있는 볼륨 — 다시 배포해도 안 사라진다
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hifis} -d ${POSTGRES_DB:-hifis}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 업로드 파일(서명·아바타·문서) — 볼륨이 없으면 재배포 때 통째로 사라진다
      - uploads:/app/uploads
      # 마이그레이션 — 이미지에도 구워져 있지만(Dockerfile) 여기서 한 번 더 덮어
      # **지금 체크아웃된 커밋의 alembic** 을 쓰게 한다. 이미지가 낡아도 안 어긋난다.
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  uploads:
