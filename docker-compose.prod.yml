name: hifis

# 배포용 구성 — 개발용 docker-compose.yml 과 다른 점
#   · 소스 마운트·핫리로드 없음 (이미지에 구운 gunicorn 으로 실행)
#   · db·redis 를 호스트에 노출하지 않음 (내부 네트워크로만)
#   · api 는 127.0.0.1:8000 에만 (앞단 nginx 가 받는다)
#   · 데이터는 전부 이름있는 볼륨 — 다시 배포해도 안 사라진다
#   · 컨테이너마다 메모리·CPU 상한 (아래 참고)
#
# 자원 상한을 왜 두나 —
#   상한이 없으면 하나가 폭주할 때 **서버 전체가 같이 넘어간다.** 상한이 있으면
#   그 컨테이너만 죽고(OOM) `restart: unless-stopped` 로 되살아난다.
#   서버는 28GB · 8코어라 아래 값을 다 합쳐도 절반이 안 된다 —
#   채용사이트·모니터링·OS 몫을 남겨 둔 값이다.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hifis} -d ${POSTGRES_DB:-hifis}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 4g
    cpus: 4.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 업로드 파일(서명·아바타·문서) — 볼륨이 없으면 재배포 때 통째로 사라진다
      - uploads:/app/uploads
      # 마이그레이션 — 이미지에도 구워져 있지만(Dockerfile) 여기서 한 번 더 덮어
      # **지금 체크아웃된 커밋의 alembic** 을 쓰게 한다. 이미지가 낡아도 안 어긋난다.
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 추첨 게임 영상 일꾼 — 매월 1일에 세 번 부른다 (`workers/draw_videos.py`)
  #
  # **호스트에 포트를 안 연다.** api 만 내부망으로 부른다.
  #
  # 클라이언트는 **다른 compose 스택**(`hifis-client`)이라 그 네트워크에 같이
  # 붙어서 `http://app:3002` 로 부른다.
  #
  # ⚠️ **`host.docker.internal` 로는 못 간다.** 클라이언트가 호스트에
  # `127.0.0.1:3002` 로만 열려 있어서(루프백), 게이트웨이 주소로 두드리면
  # 연결이 거절된다. 공개 주소(`https://hifis.app`)로 돌 수도 있지만 그러면
  # 같은 서버 안의 일을 클라우드플레어까지 한 바퀴 돌린다.
  reels:
    build: ./tools/reels
    restart: unless-stopped
    env_file: .env
    # 크롬이 /dev/shm 을 쓴다 — 기본 64MB 로는 1080×1920 에서 탭이 죽는다
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2.0
    environment:
      CLIENT_BASE_URL: ${REELS_CLIENT_URL:-http://app:3002}
    networks:
      # api 가 부르는 길
      - default
      # 클라이언트 페이지를 여는 길
      - client
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# 클라이언트는 따로 돌아가는 스택이다 — 여기서 만들지 않고 **붙기만** 한다.
# 이름이 바뀌면(`docker network ls`) 아래 `name` 도 같이 고친다.
networks:
  default:
  client:
    external: true
    name: hifis-client_default

volumes:
  pgdata:
  redisdata:
  uploads:
