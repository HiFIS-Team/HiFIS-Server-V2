# 업로드 본문 상한 — 앞단 nginx 가 자르지 않게 한다.
#
#   설치:  sudo install -m 644 nginx-upload.conf /etc/nginx/conf.d/hifis-upload.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# ## 왜 있나
#
# nginx 가 기본값(1m)이거나 50m 으로 잡혀 있으면 **서버 코드까지 오지도 않는다.**
# `storage.py` 는 영상을 100MB 까지 받도록 적혀 있는데, 50MiB 를 넘는 순간
# nginx 가 제 기본 HTML 로 413 을 돌려준다 — 우리 에러 봉투가 없어서 앱에는
# "오류 413" 만 떴고, 쓰는 사람은 왜 안 되는지 알 길이 없었다.
#
# 사진은 앱이 올리기 전에 수백 KB 로 줄여서(`photo.dart`) 이 벽에 안 닿는다.
# **영상만 원본 그대로 올라가서** 운동일지에서 영상만 안 올라가는 것처럼 보였다.
#
# ## 왜 100m 인가
#
# 클라우드플레어 무료 요금제의 본문 상한이 100MB 다. 여기를 더 올려 봐야
# 클라우드플레어가 먼저 자른다. 서버 코드의 상한(`_WORKOUT_VIDEO_MAX`)과
# 같은 값이라 어느 쪽이 거절해도 사람에게 보이는 한계가 같다.
client_max_body_size 100m;
